<div class="tl" style="margin-top:14px"><b>🔒 Access log</b>${v.length?v.map(w=>`<div><b>${esc(U(w.by).name)}</b> (${esc(U(w.by).type)}) viewed · ${fd(w.ts)}</div>`).join(""):`<div>No views yet</div>`}</div>
<p style="margin-top:12px">⭐ <b>Interested:</b> <span class="mu">${k.length?k.map(w=>esc(U(w.by).name)).join(", "):"none yet"}</span></p>${top?`<p>🤖 <b>Best match:</b> <span class="mu">${esc(top.x.name)} · ${top.s}%</span></p>`:""}</div>`}).join("")||`<p class="mu">No ideas yet.</p>`}</div>`}

function sec(){const X=[["🪪","Verified identity","Aadhaar or PAN, email and 18+ checks, validated on the server."],["🛡️","NDA gate","Confidential details never leave the server until an NDA is accepted."],["⏱️","Access log","Every view is stored with the investor and a timestamp."],["🤖","Safe matching","Matching uses only public teasers."],["⚖️","Compliance","NDA acceptance is recorded for each view."],["💬","Private contact","Contact stays in-platform until both sides agree."],["🔐","Data privacy","IDs are masked and only the last 4 characters are kept."]];

if(/match|best|top|recommend/.test(q)){if(u&&u.role==="investor"){const t=ranked(u)[0];return`Your top match is “${t.title}” (${t.sc}% match, ${t.sector}, ${inr(t.ask)}).`}
if(u){const i=S.ideas.find(x=>x.owner===u.id);if(i){const b=S.users.filter(x=>x.role==="investor").map(x=>({x,s:score(i,x)})).sort((a,b)=>b.s-a.s)[0];return`For “${i.title}”, your best investor match is ${b.x.name} (${b.s}%).`}}return"Sign in (or use a demo) and I’ll find your best matches."}

if(/fund|raise|ask|pitch/.test(q))return"Tip: keep your teaser under 120 characters, show traction, and tie your ask to a milestone.";

document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".tile");if(t){const r=t.getBoundingClientRect();t.style.setProperty("--rx",((e.clientY-r.top)/r.height-.5)*-9+"deg");t.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*9+"deg")}});

<script>
var view="grid",FEED=[],ftI=0,dk=[],busy=false;const passed=new Set();
function boom(x=innerWidth/2,y=innerHeight/2){const c=$("#cf"),g=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const K=["#1550a8","#1e9e96","#f2c94c","#1f7a0f","#ffffff"],P=Array.from({length:90},()=>({x,y,vx:(Math.random()-.5)*15,vy:Math.random()*-14-3,r:Math.random()*6+3,c:K[Math.random()*5|0],a:1}));
(function f(){g.clearRect(0,0,c.width,c.height);let n=0;P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a-=.011;if(p.a>0){n++;g.globalAlpha=p.a;g.fillStyle=p.c;g.fillRect(p.x,p.y,p.r,p.r*1.6)}});n?requestAnimationFrame(f):g.clearRect(0,0,c.width,c.height)})()}
addEventListener("scroll",()=>{$("#sp").style.width=(scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100)+"%"});
function feed(){const iv=S.users.filter(x=>x.role==="investor"),id=S.ideas;if(!iv.length||!id.length)return"";
FEED=Array.from({length:6},(_,k)=>`${esc(iv[(k*2)%iv.length].name)} ${["showed interest in","unlocked details of","saved"][k%3]} <b>${esc(id[(k*3+1)%id.length].title)}</b> · ${k*3+2}m ago`);
return`<div class="live rv"><span class="dot"></span><b>LIVE</b><div id="fd">${FEED[0]}</div><span class="mu" style="font-size:12px">(sample activity)</span></div>`}
setInterval(()=>{const e=$("#fd");if(!e||!FEED.length)return;ftI=(ftI+1)%FEED.length;e.style.opacity=0;setTimeout(()=>{e.innerHTML=FEED[ftI];e.style.opacity=1},300)},3200);
const pscore=(i,v,k)=>Math.min(100,45+STG.indexOf(i.stage)*10+Math.min(20,v.length*4)+Math.min(25,k.length*12));
function rocket(v,k){const m=Math.min(100,v.length*12+k.length*30),l=m>=70?"Ready for liftoff":m>=35?"Gaining altitude":"On the launchpad";

function tagline(){const t=$("#t").value.trim()||"Our startup",s=$("#s").value,T=[`${t}: rethinking ${s} for Bharat.`,`${t} turns ${s} problems into scalable products.`,`Meet ${t} — ${s} built for the next 100 million users.`,`${t}: small team, big ${s} impact.`];$("#p").value=T[Math.random()*T.length|0]}
function investor(u){const sw=view==="swipe";
return`<div class="wrap"><div class="eye" style="margin-top:50px">Verified ${esc(u.idMasked)} · ${esc(u.type||"Investor")}</div><h1 style="font-size:clamp(40px,7vw,88px)">Your <span class="g">picks.</span></h1>
<div class="stats"><div class="st"><b data-n="${ranked(u).filter(i=>i.sc>=70).length}">0</b><span>Strong matches</span></div><div class="st"><b data-n="${new Set(S.views.map(v=>v.idea)).size}">0</b><span>Ideas viewed</span></div><div class="st"><b data-n="${S.interests.length}">0</b><span>Interests sent</span></div><div class="st"><b data-n="${S.saved.length}">0</b><span>Saved</span></div></div>

${sw?`<p class="mu">Drag a card right to show interest, left to pass. Arrow keys work too.</p><div id="stack"></div><div class="acts"><button class="rb n" onclick="swipe(-1)">✕</button><button class="rb i" onclick="dk[0]&&openIdea(dk[0].id)">ℹ</button><button class="rb y" onclick="swipe(1)">♥</button></div>`:`<div class="chips" id="chips"></div><label class="mu">Max ticket: <b id="mx" style="color:var(--tx)"></b></label><input type="range" id="rg" min="500000" max="10000000" step="500000" value="${flt.max}" oninput="flt.max=+this.value;grid()"><br><br><div class="gridc" id="gr"></div>`}</div>`}

const top=dk.slice(0,3).reverse();el.innerHTML=top.map((i,k)=>{const d=top.length-1-k,[a,b]=GR[i.sector]||["#333","#666"];
return`<div class="sw-card" style="--a:${a};--b:${b};transform:scale(${1-d*.05}) translateY(${d*16}px);z-index:${10-d}" ${d===0?`onpointerdown="dragStart(event)"`:""}><span class="stamp y">INTERESTED</span><span class="stamp n">PASS</span><div class="top"><span class="chip">${i.sector}</span><div class="ring" style="--p:${i.sc}"><b>${i.sc}</b></div></div><h3>${esc(i.title)}</h3><p>${esc(i.pitch)}</p><div class="meta"><span>${inr(i.ask)}</span><span>${i.stage}</span><span>📍 ${esc(i.city)}</span></div></div>`}).join("")}
function dragStart(e){const c=e.currentTarget,x0=e.clientX;let dx=0;c.setPointerCapture(e.pointerId);c.style.transition="none";const y=c.querySelector(".y"),n=c.querySelector(".n");
c.onpointermove=m=>{dx=m.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;y.style.opacity=Math.max(0,dx/100);n.style.opacity=Math.max(0,-dx/100)};
c.onpointerup=()=>{c.onpointermove=c.onpointerup=null;if(Math.abs(dx)>110)swipe(dx>0?1:-1);else{c.style.transition="transform .3s";c.style.transform="";y.style.opacity=n.style.opacity=0}}}
async function swipe(dir){if(busy||!dk.length)return;busy=true;const c=document.querySelector("#stack .sw-card:last-child"),i=dk[0];
if(c){c.style.transition="transform .45s,opacity .45s";c.style.transform=`translateX(${dir*700}px) rotate(${dir*28}deg)`;c.style.opacity=0}
if(dir>0){try{await api(`/ideas/${i.id}/interest?investorId=${ME}`,"POST");boom();toast("Interest sent to "+U(i.owner).name+" ✓")}catch(e){toast(e.message)}}else passed.add(i.id);
setTimeout(async()=>{if(dir>0)await load();else{dk.shift();paintDeck()}busy=false},380)}
document.addEventListener("keydown",e=>{if(pg!=="dash"||view!=="swipe"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowRight")swipe(1);if(e.key==="ArrowLeft")swipe(-1)});
</script>
