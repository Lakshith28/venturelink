<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venture Link – Where ideas meet capital</title>
<style>
:root{--bg:#f3f6fc;--card:#fff;--tx:#17203a;--mu:#64708f;--pr:#2f5fd0;--ac:#1a9a90;--bd:#dde4f2;--hero:linear-gradient(120deg,#2f5fd0,#1a9a90)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1325;--card:#182038;--tx:#e8ecf8;--mu:#9aa6c7;--pr:#7a9cf7;--ac:#3cc7bb;--bd:#2a3456;--hero:linear-gradient(120deg,#244aa8,#14786f);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:10px 18px;flex-wrap:wrap}
nav b{font-size:19px;margin-right:auto;cursor:pointer}nav a{padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mu)}nav a.on{background:var(--bg);color:var(--pr);font-weight:600}
main{max-width:1000px;margin:auto;padding:18px}
.hero{background:var(--hero);color:#fff;border-radius:18px;padding:44px 24px;text-align:center}.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 8px}.hero p{opacity:.92;max-width:560px;margin:0 auto 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.grid .card{margin:0}
.stat{font-size:26px;font-weight:700;color:var(--pr)}.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit}
button.alt{background:var(--ac)}button.ghost{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.w{background:#fff;color:#2347a0}button.o{background:transparent;color:#fff;border:1px solid #fff}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:170px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:12px;margin:2px 4px 2px 0}
.score{float:right;font-weight:700;color:var(--ac);font-size:18px}.err{color:#d33;margin:6px 0;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar i{display:block;height:12px;border-radius:6px;background:var(--ac)}.bar span{width:90px;font-size:13px}
h2{margin:22px 0 6px}.ok{color:var(--ac);font-size:12px;font-weight:600}
#chatb{position:fixed;right:16px;bottom:16px;z-index:9;border-radius:30px;padding:12px 18px;box-shadow:0 4px 14px #0004}
#chat{position:fixed;right:16px;bottom:70px;width:min(340px,calc(100% - 32px));z-index:9;display:none;box-shadow:0 6px 24px #0005}
#msgs{height:230px;overflow:auto;font-size:14px}#msgs div{margin:6px 0;padding:7px 10px;border-radius:10px;background:var(--bg)}#msgs .u{background:var(--pr);color:#fff;margin-left:30px}
</style></head><body>
<nav id="nav"></nav><main id="app">Loading…</main>
<button id="chatb" class="alt" onclick="toggleChat()">🤖 Ask AI</button>
<div id="chat" class="card"><b>Venture AI Assistant</b><div id="msgs"><div>Hi! Ask me about matching, funding, security or mentors.</div></div>
<input id="q" placeholder="Type and press Enter…" onkeydown="if(event.key==='Enter')ask()"></div>
<script>
const SECT=["FinTech","AgriTech","HealthTech","EdTech","CleanTech","E-commerce"],STG=["Idea","Prototype","Early revenue"];
const inr=n=>"₹"+(n>=1e7?(n/1e7).toFixed(1)+" Cr":n>=1e5?(n/1e5).toFixed(1)+" L":n.toLocaleString("en-IN"));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s),fd=t=>new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
let S={users:[],ideas:[],views:[],interests:[],saved:[],mreq:[],mentors:[]},ME=null,pg="home",flt={sector:"",max:0};
try{ME=localStorage.getItem("vl_me")}catch(e){}
async function api(p,method="GET",body){const r=await fetch("/api"+p,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error((j&&j.message)||"Request failed ("+r.status+")");return j}
const setMe=id=>{ME=id;try{id?localStorage.setItem("vl_me",id):localStorage.removeItem("vl_me")}catch(e){}};
async function load(){try{S=await api("/state?me="+encodeURIComponent(ME||""))}catch(e){setMe(null);S=await api("/state")}render()}
const me=()=>S.users.find(u=>u.id===ME),U=id=>S.users.find(u=>u.id===id)||{name:"Unknown"};
const go=p=>{pg=p;render();scrollTo(0,0)};
const score=(i,u)=>(u.sectors.includes(i.sector)?50:0)+(u.stages.includes(i.stage)?20:0)+(i.ask<=u.maxTicket?30:0);
const ranked=u=>S.ideas.map(i=>({...i,sc:score(i,u)})).sort((a,b)=>b.sc-a.sc);
const act=async(f)=>{try{await f();await load()}catch(e){alert(e.message)}};

function render(){const u=me();
$("#nav").innerHTML=`<b onclick="go('home')">🔗 Venture Link</b>`+[["home","Home"],["sec","Security"],["men","Mentors"]].concat(u?[["dash","My dashboard"]]:[]).map(([k,l])=>`<a class="${pg===k?"on":""}" onclick="go('${k}')">${l}</a>`).join("")+(u?`<span class="mu">${esc(u.name)}</span><button class="ghost" onclick="setMe(null);load().then(()=>go('home'))">Logout</button>`:"");
$("#app").innerHTML=({home,sec,men,dash,auth})[pg.split(":")[0]](pg.split(":")[1])}

function bars(){const c=SECT.map(s=>[s,S.ideas.filter(i=>i.sector===s).length]),m=Math.max(...c.map(x=>x[1]),1);return c.map(([s,n])=>`<div class="bar"><span>${s}</span><i style="width:${n/m*60}%"></i> ${n}</div>`).join("")}
function home(){const u=me(),tot=S.ideas.reduce((a,i)=>a+i.ask,0);
return`<div class="hero"><h1>Connect. Invest. Grow.</h1><p>The trusted platform where verified student entrepreneurs meet serious investors, with smart matching and built-in idea protection.</p>
${u?`<button class="w" onclick="go('dash')">Open my dashboard</button>`:`<button class="w" onclick="go('auth:entrepreneur')">I’m an Entrepreneur</button> <button class="o" onclick="go('auth:investor')">I’m an Investor</button><br><br><span style="opacity:.85">Quick demo:</span> <button class="o" onclick="demo('u1')">▶ Demo as Entrepreneur</button> <button class="o" onclick="demo('v1')">▶ Demo as Investor</button>`}</div>
<div class="grid" style="margin-top:14px"><div class="card"><div class="stat">${S.ideas.length}</div>Verified ideas live</div><div class="card"><div class="stat">${inr(tot)}</div>Total funding sought</div>
<div class="card"><div class="stat">${S.users.filter(x=>x.role==="entrepreneur").length}</div>Verified entrepreneurs</div><div class="card"><div class="stat">${S.users.filter(x=>x.role==="investor").length}</div>Verified investors</div></div>
<h2>How it works</h2><div class="grid"><div class="card"><b>1 · Verify</b><p class="mu">Aadhaar/PAN, email and 18+ age check for every user.</p></div><div class="card"><b>2 · Match</b><p class="mu">Scoring on sector, stage and ticket size.</p></div>
<div class="card"><b>3 · Protect</b><p class="mu">NDA gate and timestamped access log on every view.</p></div><div class="card"><b>4 · Grow</b><p class="mu">Express interest, get mentored, close the round.</p></div></div>
<h2>Ideas by sector</h2><div class="card">${bars()}</div>`}
function demo(id){setMe(id);load().then(()=>go("dash"))}

function auth(role){const inv=role==="investor";return`<div class="card"><h2 style="margin-top:0">${inv?"Investor":"Entrepreneur"} sign-up / login</h2>
<div class="row"><div>Full name<input id="n"></div><div>Email<input id="e" type="email"></div></div>
<div class="row"><div>ID type<select id="t"><option>Aadhaar</option><option>PAN</option></select></div><div>ID number<input id="d" placeholder="12-digit Aadhaar or ABCDE1234F"></div><div>Date of birth<input id="b" type="date"></div></div>
${inv?`<div class="row"><div>Preferred sectors (Ctrl/Cmd for many)<select id="s" multiple size="6">${SECT.map(x=>`<option>${x}</option>`).join("")}</select></div><div>Preferred stages<select id="g" multiple size="3">${STG.map(x=>`<option>${x}</option>`).join("")}</select>Max ticket (₹)<input id="m" type="number" value="3000000"></div></div>`:""}
<div id="er" class="err"></div><button onclick="doAuth('${role}')">Verify &amp; continue</button> <button class="ghost" onclick="go('home')">Back</button></div>`}
async function doAuth(role){const pick=id=>$(id)?[...$(id).selectedOptions].map(o=>o.value):[];
try{const u=await api("/register","POST",{name:$("#n").value,email:$("#e").value,role,idType:$("#t").value,idNumber:$("#d").value,dob:$("#b").value,sectors:pick("#s"),stages:pick("#g"),maxTicket:$("#m")?+$("#m").value:0});
setMe(u.id);await load();go("dash")}catch(e){$("#er").textContent="⚠ "+e.message}}

function dash(){const u=me();if(!u)return`<div class="card">Please sign in from Home.</div>`;return u.role==="investor"?investor(u):founder(u)}
function founder(u){const mine=S.ideas.filter(i=>i.owner===u.id),invs=S.users.filter(x=>x.role==="investor");
return`<h2 style="margin-top:0">Welcome, ${esc(u.name)} <span class="ok">✔ Verified ${u.idMasked}</span></h2>
<div class="grid"><div class="card"><div class="stat">${mine.length}</div>Ideas pitched</div><div class="card"><div class="stat">${S.views.length}</div>Investor views</div><div class="card"><div class="stat">${S.interests.length}</div>Interested investors</div><div class="card"><div class="stat">${inr(mine.reduce((a,i)=>a+i.ask,0))}</div>Total ask</div></div>
<details class="card"><summary><b>+ Pitch a new idea</b></summary><div class="row"><div>Title<input id="t"></div><div>Sector<select id="s">${SECT.map(x=>`<option>${x}</option>`).join("")}</select></div><div>Stage<select id="g">${STG.map(x=>`<option>${x}</option>`).join("")}</select></div><div>Ask (₹)<input id="a" type="number"></div></div>
Public teaser<input id="p" maxlength="120">Confidential details (NDA-gated)<textarea id="x" rows="3"></textarea><button onclick="addIdea()">Publish</button></details>
<h2>Your ideas</h2>${mine.map(i=>{const v=S.views.filter(w=>w.idea===i.id).sort((a,b)=>b.ts-a.ts),k=S.interests.filter(w=>w.idea===i.id),top=invs.map(x=>({x,s:score(i,x)})).sort((a,b)=>b.s-a.s)[0];
return`<div class="card"><b>${esc(i.title)}</b> <span class="tag">${i.sector}</span><span class="tag">${i.stage}</span><span class="tag">${inr(i.ask)}</span><p>${esc(i.pitch)}</p>
<div class="mu"><b>🔒 Access log:</b> ${v.length?v.map(w=>`<div>👁 ${esc(U(w.by).name)} (${esc(U(w.by).type)}) · ${fd(w.ts)}</div>`).join(""):"no views yet"}</div>
<div class="mu"><b>⭐ Interested:</b> ${k.length?k.map(w=>esc(U(w.by).name)).join(", "):"none yet"}</div>${top?`<div class="mu"><b>🤖 Best-matched investor:</b> ${esc(top.x.name)} (${top.s}% match)</div>`:""}</div>`}).join("")||`<p class="mu">No ideas yet.</p>`}`}
function addIdea(){act(()=>api("/ideas","POST",{ownerId:ME,title:$("#t").value,sector:$("#s").value,stage:$("#g").value,ask:+$("#a").value,pitch:$("#p").value,detail:$("#x").value}))}

function investor(u){const L=ranked(u).filter(i=>(!flt.sector||i.sector===flt.sector)&&(!flt.max||i.ask<=flt.max));
return`<h2 style="margin-top:0">Welcome, ${esc(u.name)} <span class="ok">✔ Verified ${u.idMasked}</span></h2>
<div class="grid"><div class="card"><div class="stat">${ranked(u).filter(i=>i.sc>=70).length}</div>Strong matches (70%+)</div><div class="card"><div class="stat">${new Set(S.views.map(v=>v.idea)).size}</div>Ideas viewed</div><div class="card"><div class="stat">${S.interests.length}</div>Interests sent</div><div class="card"><div class="stat">${S.saved.length}</div>Saved</div></div>
<p class="mu">Focus: ${u.sectors.join(", ")} · ${u.stages.join(", ")} · up to ${inr(u.maxTicket)}</p>
<div class="row"><div><select onchange="flt.sector=this.value;render()"><option value="">All sectors</option>${SECT.map(x=>`<option ${flt.sector===x?"selected":""}>${x}</option>`).join("")}</select></div>
<div><select onchange="flt.max=+this.value;render()">${[[0,"Any ticket size"],[1000000,"Up to ₹10 L"],[3000000,"Up to ₹30 L"],[6000000,"Up to ₹60 L"]].map(([v,l])=>`<option value="${v}" ${flt.max===v?"selected":""}>${l}</option>`).join("")}</select></div></div>
${L.map(i=>`<div class="card"><span class="score">${i.sc}% match</span><b>${esc(i.title)}</b> <span class="tag">${i.sector}</span><span class="tag">${i.stage}</span><span class="tag">${inr(i.ask)}</span><span class="tag">📍${esc(i.city)}</span>
<p>${esc(i.pitch)} <span class="mu">by ${esc(U(i.owner).name)} ✔</span></p><div id="d${i.id}"><button onclick="nda('${i.id}')">View confidential details</button> <button class="ghost" onclick="act(()=>api('/ideas/${i.id}/save?investorId='+ME,'POST'))">${S.saved.includes(i.id)?"★ Saved":"☆ Save"}</button></div></div>`).join("")||`<p class="mu">No ideas match these filters.</p>`}`}
function nda(id){$("#d"+id).innerHTML=`<label><input type="checkbox" id="n${id}" style="width:auto"> I accept the NDA. I won’t copy or share this idea, and my access is logged.</label><br><button onclick="reveal('${id}')">Accept &amp; view</button>`}
async function reveal(id){if(!$("#n"+id).checked)return alert("Please accept the NDA first.");
try{const r=await api(`/ideas/${id}/view?investorId=${ME}&ndaAccepted=true`,"POST");
$("#d"+id).innerHTML=`<div class="card" style="background:var(--bg)"><b>🔓 Confidential:</b> ${esc(r.detail)}<div class="mu">Access logged at ${fd(r.ts)} · ID ${esc(ME)}</div><button class="alt" onclick="interest('${id}')">Express interest</button> <span id="m${id}"></span></div>`}catch(e){alert(e.message)}}
async function interest(id){try{await api(`/ideas/${id}/interest?investorId=${ME}`,"POST");$("#m"+id).textContent="✅ Interest sent to the founder."}catch(e){alert(e.message)}}

function sec(){const X=[["🪪","User verification","Aadhaar/PAN, email and 18+ age checks, validated on the server."],["🛡️","Idea & prototype protection","Confidential details never leave the server until an NDA is accepted."],["⏱️","Timestamped access log","Every view is stored with investor identity and time."],["🤖","Matching security","Matching uses only public teasers."],["⚖️","Legal & compliance","NDA acceptance is recorded for each view."],["💬","Communication security","Contact stays in-platform until both sides consent."],["🔐","Data privacy","IDs are masked; only the last 4 characters are kept."]];
return`<h2 style="margin-top:0">Security — anti idea-theft measures</h2><div class="grid">${X.map(s=>`<div class="card"><div style="font-size:26px">${s[0]}</div><b>${s[1]}</b><p class="mu">${s[2]}</p></div>`).join("")}</div>`}
function men(){return`<h2 style="margin-top:0">Mentorship &amp; community</h2><div class="grid">${S.mentors.map(m=>`<div class="card"><b>${m.n}</b><div class="mu">${m.r}</div><span class="tag">${m.s}</span><br><br><button class="${S.mreq.includes(m.id)?"alt":""}" onclick="book('${m.id}')">${S.mreq.includes(m.id)?"✔ Session requested":"Request session"}</button></div>`).join("")}</div>`}
function book(id){if(!ME)return alert("Please sign in or use a demo login first.");act(()=>api(`/mentors/${id}/request?userId=${ME}`,"POST"))}

function toggleChat(){const c=$("#chat");c.style.display=c.style.display==="block"?"none":"block"}
function reply(q){q=q.toLowerCase();const u=me();
if(/match|best|top|recommend/.test(q)){if(u&&u.role==="investor"){const t=ranked(u)[0];return`Your top match is “${t.title}” (${t.sc}% match, ${t.sector}, ${inr(t.ask)}).`}
if(u){const i=S.ideas.find(x=>x.owner===u.id);if(i){const b=S.users.filter(x=>x.role==="investor").map(x=>({x,s:score(i,x)})).sort((a,b)=>b.s-a.s)[0];return`For “${i.title}”, your best investor match is ${b.x.name} (${b.s}%).`}}return"Sign in (or use a demo login) and I’ll find your best matches."}
if(/secur|theft|nda|safe|steal/.test(q))return"Confidential details are NDA-gated on the server, every view is timestamped, and IDs are masked.";
if(/fund|raise|ask|pitch/.test(q))return"Tip: keep the teaser under 120 characters, state traction clearly, and tie your ask to a milestone.";
if(/mentor/.test(q))return"Open the Mentors page to request a session with an expert in your sector.";
return"Try asking about matches, security, funding or mentors."}
function ask(){const i=$("#q"),v=i.value.trim();if(!v)return;const m=$("#msgs");m.innerHTML+=`<div class="u">${esc(v)}</div><div>${esc(reply(v))}</div>`;i.value="";m.scrollTop=1e9}
load().catch(e=>{$("#app").innerHTML=`<div class="card err">Could not reach the server: ${esc(e.message)}</div>`});
</script></body></html>
