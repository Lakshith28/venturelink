<div class="seg"><button class="${sw?"":"on"}" onclick="view='grid';render()">▦ Browse</button><button class="${sw?"on":""}" onclick="view='swipe';render()">🔥 Swipe mode</button></div>
${sw?`<p class="mu">Drag a card right to show interest, left to pass. Arrow keys work too.</p><div id="stack"></div><div class="acts"><button class="rb n" onclick="swipe(-1)">✕</button><button class="rb i" onclick="dk[0]&&openIdea(dk[0].id)">ℹ</button><button class="rb y" onclick="swipe(1)">♥</button></div>`:`<div class="chips" id="chips"></div><label class="mu">Max ticket: <b id="mx" style="color:var(--tx)"></b></label><input type="range" id="rg" min="500000" max="10000000" step="500000" value="${flt.max}" oninput="flt.max=+this.value;grid()"><br><br><div class="gridc" id="gr"></div>`}</div>`}
function deck(){const u=me();dk=ranked(u).filter(i=>!S.interests.some(k=>k.idea===i.id)&&!passed.has(i.id));paintDeck()}
function paintDeck(){const el=$("#stack");if(!el)return;if(!dk.length){el.innerHTML=`<div class="card" style="text-align:center;margin-top:40px"><h3>You’re all caught up 🎉</h3><p class="mu">New pitches land here as founders publish them.</p><br><button class="btn v" onclick="passed.clear();deck()">Review passed ideas</button></div>`;return}
const top=dk.slice(0,3).reverse();el.innerHTML=top.map((i,k)=>{const d=top.length-1-k,[a,b]=GR[i.sector]||["#333","#666"];
return`<div class="sw-card" style="--a:${a};--b:${b};transform:scale(${1-d*.05}) translateY(${d*16}px);z-index:${10-d}" ${d===0?`onpointerdown="dragStart(event)"`:""}><span class="stamp y">INTERESTED</span><span class="stamp n">PASS</span><div class="top"><span class="chip">${i.sector}</span><div class="ring" style="--p:${i.sc}"><b>${i.sc}</b></div></div><h3>${esc(i.title)}</h3><p>${esc(i.pitch)}</p><div class="meta"><span>${inr(i.ask)}</span><span>${i.stage}</span><span>📍 ${esc(i.city)}</span></div></div>`}).join("")}
function dragStart(e){const c=e.currentTarget,x0=e.clientX;let dx=0;c.setPointerCapture(e.pointerId);c.style.transition="none";const y=c.querySelector(".y"),n=c.querySelector(".n");
c.onpointermove=m=>{dx=m.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;y.style.opacity=Math.max(0,dx/100);n.style.opacity=Math.max(0,-dx/100)};
c.onpointerup=()=>{c.onpointermove=c.onpointerup=null;if(Math.abs(dx)>110)swipe(dx>0?1:-1);else{c.style.transition="transform .3s";c.style.transform="";y.style.opacity=n.style.opacity=0}}}
async function swipe(dir){if(busy||!dk.length)return;busy=true;const c=document.querySelector("#stack .sw-card:last-child"),i=dk[0];
if(c){c.style.transition="transform .45s,opacity .45s";c.style.transform=`translateX(${dir*700}px) rotate(${dir*28}deg)`;c.style.opacity=0}
if(dir>0){try{await api(`/ideas/${i.id}/interest?investorId=${ME}`,"POST");boom();toast("Interest sent to "+U(i.owner).name+" ✓")}catch(e){toast(e.message)}}else passed.add(i.id);
setTimeout(async()=>{if(dir>0)await load();else{dk.shift();paintDeck()}busy=false},380)}
document.addEventListener("keydown",e=>{if(pg!=="dash"||view!=="swipe"||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowRight")swipe(1);if(e.key==="ArrowLeft")swipe(-1)});
</script>
<script>
var tb="ideas",MT=null,ff={s:"",b:0},PROTO="";
Object.assign(S,{subs:[],unlocks:[],approaches:[],groups:[],teams:[],plans:[]});
const BAND=a=>a<=5e5?2:a<=25e5?3:4,TAG={2:"Low return",3:"Medium return",4:"High return"},LV=["","","l","m","h"];
const hasPlan=p=>S.subs.includes(p),unl=id=>S.unlocks.find(x=>x.idea===id),idea=id=>S.ideas.find(x=>x.id===id);
const ini=n=>String(n).split(" ").filter(w=>/^[A-Za-z]/.test(w)&&!w.endsWith(".")).map(w=>w[0]).slice(0,2).join("");
const dw=(h,b,col)=>{$("#dr").innerHTML=`<div class="dh" style="background:${col||"linear-gradient(135deg,var(--v),var(--gr))"}"><button class="x" onclick="closeDr()">✕</button><h2>${h}</h2></div><div class="db">${b}</div>`;showDr()};
const opts=a=>a.map(x=>`<option>${x}</option>`).join("");
function svgProto(i){const [a,b]=GR[i.sector]||["#333","#666"],w=[[20,60],[60,140],[0,220]].map(p=>`<text transform='rotate(-25 200 125)' x='${p[0]}' y='${p[1]}'>VENTURE LINK · PREVIEW ONLY</text>`).join("");
return"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 250'><defs><linearGradient id='g'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='400' height='250' fill='url(#g)'/><rect x='30' y='30' width='340' height='190' rx='14' fill='#fff' fill-opacity='.18'/><text x='200' y='135' font-size='30' fill='#fff' text-anchor='middle' font-family='Arial' font-weight='700'>${i.title.replace(/[<&]/g,"")}</text><text x='200' y='168' font-size='14' fill='#fff' fill-opacity='.85' text-anchor='middle' font-family='Arial'>Prototype preview</text><g fill='#fff' fill-opacity='.38' font-size='16' font-family='Arial' font-weight='700'>${w}</g></svg>`)}
const protoSrc=i=>i.proto?`/api/ideas/${i.id}/proto`:svgProto(i);
function wm(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;const g=c.getContext("2d");g.drawImage(im,0,0,c.width,c.height);g.save();g.rotate(-Math.PI/7);g.font="bold "+Math.max(18,c.width/18)+"px Arial";g.fillStyle="rgba(255,255,255,.55)";g.strokeStyle="rgba(0,0,0,.35)";
for(let y=-c.height;y<c.height*2;y+=c.height/4)for(let x=-c.width;x<c.width*2;x+=c.width/1.5){g.strokeText("VENTURE LINK • PREVIEW",x,y);g.fillText("VENTURE LINK • PREVIEW",x,y)}g.restore();ok(c.toDataURL("image/jpeg",.72))};im.onerror=()=>no(new Error("Could not read that image"));im.src=r.result};r.readAsDataURL(file)})}
function setTab(t){tb=t;if(t==="ai")loadMatch();else render()}
async function loadMatch(){try{MT=await api("/match?userId="+ME)}catch(e){toast(e.message)}render()}
function logout(){setMe(null);tb="ideas";MT=null;load().then(()=>go("home"))}

function render(){const u=me(),role=u?u.role:(pg.startsWith("auth:")?pg.split(":")[1]:"");document.body.className=role==="investor"?"inv":role==="entrepreneur"?"ent":"";view=tb==="swipe"?"swipe":"grid";
$("#nav").innerHTML=`<div class="brand" onclick="go('home')">Venture<i>Link</i></div>`+[["home","Home"]].concat(u?[["dash","My dashboard"]]:[]).concat([["sec","Security"],["men","Mentors"]]).map(([k,l])=>`<a class="${pg===k?"on":""}" onclick="go('${k}')">${l}</a>`).join("")+(u?`<span class="mu" style="margin:0 12px;font-size:14px">${esc(u.name)} · ${u.role}</span><button class="btn s o" onclick="logout()">Log out</button>`:`<button class="btn s o" onclick="go('auth:entrepreneur')">Entrepreneur login</button><button class="btn s v" onclick="go('auth:investor')">Investor login</button>`);
$("#app").innerHTML=({home,sec,men,dash,auth})[pg.split(":")[0]](pg.split(":")[1]);post();
if(u&&pg==="dash"&&u.role==="investor"){if(tb==="swipe")deck();if(tb==="ideas")paintIdeas()}}
const _h=home;home=function(){return _h()+`<div class="wrap"><h2 class="sh rv">Subscriptions.</h2><div class="steps">${S.plans.map(p=>`<div class="step rv"><b>${p.id}</b><h3>${p.name}</h3><p><b>${inr(p.price)}</b> ${p.perIdea?"per idea invested":"per month"}</p><p>${p.blurb}</p></div>`).join("")}</div></div>`};
const _rp=reply;reply=function(q){const l=q.toLowerCase();if(/plan|subscri|price|cost/.test(l))return"4 plans: Basic Access ₹4,999/month, then per-idea fees of ₹8K (₹70K–5L ideas), ₹20K (₹5L–25L) and ₹50K (₹26L–1Cr).";if(/combine|group|team/.test(l))return"Combine & Invest lets 3–4 investors back one idea (the founder must accept). Combine & Grow lets founders team up.";return _rp(q)};

function auth(role){const inv=role==="investor";return`<div class="auth vis"><div class="eye">${inv?"Investor portal":"Entrepreneur portal"}</div><h2>${inv?"Investor login":"Founder login"}</h2><p class="mu" style="margin-bottom:14px">A verified Indian government ID (Aadhaar or PAN) and the email linked to it are required. We send a one-time code to that email.</p>
<div class="row"><div>Full name<input id="n" class="fi"></div><div>City<input id="c" class="fi"></div></div>
<div class="row"><div>Email linked to your ID<input id="e" type="email" class="fi"></div><div>Date of birth<input id="b" type="date" class="fi"></div></div>
<div class="row"><div>ID type<select id="t" class="fi">${opts(["Aadhaar","PAN"])}</select></div><div>ID number<input id="d" class="fi" placeholder="12 digits or ABCDE1234F"></div></div>
${inv?`<div class="row"><div>Fields of interest (Ctrl/Cmd for many)<select id="s" multiple size="6" class="fi">${opts(SECT)}</select></div><div>Preferred stages<select id="g" multiple size="3" class="fi">${opts(STG)}</select>Ticket size ₹ (min / max)<div class="row"><input id="m1" type="number" class="fi" value="70000"><input id="m2" type="number" class="fi" value="5000000"></div>Target return (% a year)<input id="mr" type="number" class="fi" value="15"></div></div>`:""}
<div id="er" class="err"></div><div id="otpbox"></div><button class="btn v" onclick="startAuth('${role}')">Verify ID &amp; send OTP</button> <button class="btn o" onclick="go('home')">Back</button></div>`}
async function startAuth(role){const pick=id=>$(id)?[...$(id).selectedOptions].map(o=>o.value):[];
try{const r=await api("/auth/start","POST",{name:$("#n").value,email:$("#e").value,role,idType:$("#t").value,idNumber:$("#d").value,dob:$("#b").value,city:$("#c").value,sectors:pick("#s"),stages:pick("#g"),minTicket:$("#m1")?+$("#m1").value:null,maxTicket:$("#m2")?+$("#m2").value:null,minReturn:$("#mr")?+$("#mr").value:null});
$("#er").textContent="";$("#otpbox").innerHTML=`<div class="card"><p>A 6-digit code was sent to <b>${esc($("#e").value)}</b>.</p><p class="mu">Demo mode, your code is <b style="color:var(--v)">${r.otp}</b></p><input id="otp" class="fi" placeholder="Enter the 6-digit code"><button class="btn v" onclick="verifyAuth('${role}')">Confirm &amp; enter</button></div>`}catch(e){$("#er").textContent="⚠ "+e.message}}
async function verifyAuth(role){try{const u=await api("/auth/verify","POST",{email:$("#e").value,role,otp:$("#otp").value});setMe(u.id);tb="ideas";await load();boom();toast("Welcome, "+u.name+" ✓");go("dash")}catch(e){$("#er").textContent="⚠ "+e.message}}

const head=(u,l)=>`<div class="dhd rv"><div class="eye" style="color:#fff;opacity:.85">${l} · ✔ Verified ${esc(u.idMasked)}</div><h1 style="font-size:clamp(34px,6vw,72px);color:#fff">Hello, ${esc(u.name.split(" ")[0])}</h1></div>`;
const stats=a=>`<div class="stats">${a.map(([n,l])=>`<div class="st"><b data-n="${n}">0</b><span>${l}</span></div>`).join("")}</div>`;
const tabs=a=>`<div class="tabs">${a.map(([k,l,c])=>`<button class="fc ${c||""} ${tb===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("")}</div>`;
function dash(){const u=me();if(!u)return`<div class="wrap"><h2 class="sh">Please log in.</h2></div>`;return`<div class="wrap">${u.role==="investor"?invDash(u):entDash(u)}</div>`}

function entDash(u){const mine=S.ideas.filter(i=>i.owner===u.id),invs=S.users.filter(x=>x.role==="investor");let b="";
if(tb==="ideas")b=`<button class="btn v" onclick="openPost()">+ Post a new idea</button><br><br>${mine.map(myIdea).join("")||`<p class="mu">You haven’t posted an idea yet.</p>`}`;
else if(tb==="investors")b=`<p class="mu">Scroll through investor profiles and approach the ones who fit your idea.</p><div class="scr">${invs.map(profile).join("")}</div>`;
else if(tb==="requests")b=reqTab(u,mine);
else if(tb==="grow")b=`<p class="mu">Founders team up to build one idea together. The team lead accepts join requests.</p><button class="btn v" onclick="openTeam()">+ Start a team</button><br><br>${S.teams.map(t=>teamCard(t,u)).join("")||`<p class="mu">No teams yet.</p>`}`;
else b=aiTab(u);
return head(u,"Entrepreneur Studio")+stats([[mine.length,"Ideas posted"],[S.unlocks.length,"Investor unlocks"],[S.interests.length,"Interested investors"],[S.approaches.length,"Approaches sent"]])+tabs([["investors","🔍 Browse Investors","cta"],["ideas","💡 My ideas"],["requests","🤝 Requests"],["grow","🌱 Combine & Grow"],["ai","🤖 AI matches"]])+b}
function myIdea(i){const un=S.unlocks.filter(x=>x.idea===i.id),k=S.interests.filter(x=>x.idea===i.id),gs=S.groups.filter(g=>g.idea===i.id),b=BAND(i.ask);
return`<div class="ic"><img src="${protoSrc(i)}" alt="Watermarked prototype"><div class="icb"><span class="tg ${LV[b]}">${TAG[b]}</span><h3>${esc(i.title)}</h3><p class="mu">${esc(i.pitch)}</p><p style="font-size:14px"><b>${inr(i.ask)}</b> required · <b>${i.ret}%</b> est. return · ${i.sector} · ${i.stage}</p>
<p class="mu" style="font-size:13px">🔓 Unlocked by: ${un.length?un.map(x=>esc(U(x.inv).name)+" ("+fd(x.ts)+")").join(", "):"nobody yet"}<br>⭐ Interested: ${k.length?k.map(x=>esc(U(x.by).name)).join(", "):"none yet"}<br>🤝 Investor groups: ${gs.length}</p>${rocket(un,k)}</div></div>`}
function profile(v){return`<div class="ic"><div class="av" style="flex:none;width:64px;height:64px">${ini(v.name)}</div><div class="icb"><h3>${esc(v.name)}</h3><p class="mu">${esc(v.type||"Investor")} · 📍${esc(v.city)}</p><p>${esc(v.bio)}</p><p>${v.sectors.map(s=>`<span class="tg">${s}</span>`).join("")}</p><p style="font-size:14px">Ticket <b>${inr(v.minTicket)} – ${inr(v.maxTicket)}</b> · Target return <b>${v.minReturn}%+</b></p><button class="btn v s" onclick="openApproach('${v.id}')">Approach investor</button></div></div>`}
function reqTab(u,mine){const ids=mine.map(i=>i.id),gs=S.groups.filter(g=>ids.includes(g.idea));
return`<h2 class="sh" style="font-size:30px;margin-top:10px">Combine &amp; Invest requests</h2>${gs.map(g=>groupCard(g,u)).join("")||`<p class="mu">No investor groups have targeted your ideas yet.</p>`}<h2 class="sh" style="font-size:30px">Approaches you sent</h2>${S.approaches.map(a=>`<div class="card"><b>${esc(U(a.to).name)}</b> · <span class="mu">${esc(idea(a.idea)?.title||"")} · ${fd(a.ts)}</span><p>${esc(a.msg)}</p></div>`).join("")||`<p class="mu">None yet. Open Browse Investors to approach someone.</p>`}`}
function teamCard(t,u){const mem=t.members.includes(u.id),req=t.requests.includes(u.id),own=t.owner===u.id,full=t.members.length>=t.size;
return`<div class="card"><div class="sb"><div><h3>${esc(t.title)}</h3><p class="mu">Led by ${esc(U(t.owner).name)} · ${t.members.length}/${t.size} members</p></div><span class="tg ${full?"h":"l"}">${full?"FULL":"OPEN"}</span></div><p>${esc(t.desc)}</p><p class="mu">Looking for: ${esc(t.skills)}</p><p class="mu">Team: ${t.members.map(m=>esc(U(m).name)).join(", ")}</p>
${own?t.requests.map(r=>`<div class="sb" style="align-items:center;margin-top:8px"><span>${esc(U(r).name)} wants to join</span><button class="btn v s" onclick="act(()=>api('/teams/${t.id}/accept?ownerId='+ME+'&userId=${r}','POST'))">Accept</button></div>`).join(""):mem?`<span class="tg l">✔ You’re in</span>`:req?`<span class="tg m">Request sent</span>`:full?"":`<button class="btn v s" onclick="act(()=>api('/teams/${t.id}/join?userId='+ME,'POST'))">Request to join</button>`}</div>`}
function openTeam(){dw("Start a team",`Team name<input id="tt" class="fi">What will you build together?<textarea id="td" rows="3" class="fi"></textarea>Skills you need<input id="ts" class="fi"><div class="row"><div>Team size (2–5)<input id="tz" type="number" min="2" max="5" value="3" class="fi"></div></div><button class="btn v" onclick="postTeam()">Create team</button>`)}
async function postTeam(){try{await api("/teams","POST",{ownerId:ME,title:$("#tt").value,desc:$("#td").value,skills:$("#ts").value,size:+$("#tz").value});closeDr();toast("Team created ✓");tb="grow";await load()}catch(e){toast(e.message)}}
function openApproach(vid){const v=U(vid),mine=S.ideas.filter(i=>i.owner===ME);if(!mine.length)return toast("Post an idea first");dw("Approach "+esc(v.name),`Your idea<select id="ai" class="fi">${mine.map(i=>`<option value="${i.id}">${esc(i.title)}</option>`).join("")}</select>Message<textarea id="am2" rows="4" class="fi" placeholder="Why is this a good fit for you?"></textarea><button class="btn v" onclick="sendApproach('${vid}')">Send</button>`)}
async function sendApproach(vid){try{await api("/approach","POST",{ideaId:$("#ai").value,from:ME,to:vid,msg:$("#am2").value});closeDr();boom();toast("Approach sent ✓");tb="requests";await load()}catch(e){toast(e.message)}}
function openPost(){PROTO="";dw("Post your idea",`Idea title<input id="t" class="fi"><div class="row"><div>Field<select id="s" class="fi">${opts(SECT)}</select></div><div>Stage<select id="g" class="fi">${opts(STG)}</select></div></div>Summary (2–3 lines)<textarea id="p" rows="3" maxlength="300" class="fi"></textarea><div class="row"><div>Required investment ₹ (70,000 – 1 Cr)<input id="a" type="number" class="fi"></div><div>Estimated return (% a year)<input id="r" type="number" class="fi"></div></div><p class="mu" style="font-size:12px;margin:-6px 0 10px">Returns are your own estimate and are shown to investors as a projection, not a guarantee.</p>Confidential details (shown only after an investor unlocks)<textarea id="x" rows="3" class="fi"></textarea>Prototype image (a watermark is added automatically)<input id="f" type="file" accept="image/png,image/jpeg" class="fi" onchange="pickProto(this)"><img id="pv" class="wmimg" style="display:none"><button class="btn v" onclick="postIdea()">Publish idea</button>`)}
async function pickProto(el){const f=el.files[0];if(!f)return;try{PROTO=await wm(f);const p=$("#pv");p.src=PROTO;p.style.display="block"}catch(e){toast(e.message)}}
async function postIdea(){try{await api("/ideas","POST",{ownerId:ME,title:$("#t").value,sector:$("#s").value,stage:$("#g").value,ask:+$("#a").value,ret:+$("#r").value,pitch:$("#p").value,detail:$("#x").value,proto:PROTO});closeDr();boom();toast("Idea published 🚀");tb="ideas";await load()}catch(e){toast(e.message)}}

function invDash(u){let b="";
if(tb==="ideas")b=`<p class="mu">Every idea posted by entrepreneurs. The summary and watermarked prototype are free. Full details and contact need a subscription.</p><div class="chips">${["",...SECT].map(s=>`<button class="fc ${ff.s===s?"on":""}" onclick="ff.s='${s}';render()">${s||"All fields"}</button>`).join("")}</div><div class="chips">${[[0,"Any size"],[2,"₹70K–5L"],[3,"₹5L–25L"],[4,"₹26L–1Cr"]].map(([x,l])=>`<button class="fc ${ff.b===x?"on":""}" onclick="ff.b=${x};render()">${l}</button>`).join("")}</div><div class="scr" id="il"></div>`;
else if(tb==="swipe")b=`<p class="mu">Drag right to show interest, left to pass. Arrow keys work too.</p><div id="stack"></div><div class="acts"><button class="rb n" onclick="swipe(-1)">✕</button><button class="rb i" onclick="dk[0]&&openIdea(dk[0].id)">ℹ</button><button class="rb y" onclick="swipe(1)">♥</button></div>`;
else if(tb==="plans")b=plansTab();
else if(tb==="combine")b=`<button class="btn v" onclick="openNewGroup()">+ Start a group</button> <span class="mu">3–4 investors pool money for one idea. The founder must accept.</span><br><br>${S.groups.map(g=>groupCard(g,u)).join("")||`<p class="mu">No groups yet.</p>`}`;
else if(tb==="inbox")b=S.approaches.map(a=>{const i=idea(a.idea);return`<div class="card"><b>${esc(U(a.from).name)}</b> pitched <b>${esc(i?i.title:"")}</b> · <span class="mu">${fd(a.ts)}</span><p>${esc(a.msg)}</p>${i?`<button class="btn v s" onclick="openIdea('${i.id}')">View idea</button>`:""}</div>`}).join("")||`<p class="mu">No founder approaches yet.</p>`;
else b=aiTab(u);

function ideaCard(i){const b=BAND(i.ask),open=unl(i.id),[a]=GR[i.sector]||["#333"];
